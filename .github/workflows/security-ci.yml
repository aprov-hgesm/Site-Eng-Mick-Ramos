name: Security CI

on:
  push:
    branches:
      - main
      - security/hardening-2026-09-14
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Commit refreshed lockfile on hardening branch
        if: github.ref == 'refs/heads/security/hardening-2026-09-14'
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: refresh bun lockfile after security updates"
            git push
          fi

      - name: TypeScript
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Dependency audit
        run: bun audit --audit-level=high

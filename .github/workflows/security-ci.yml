name: Security CI

on:
  push:
    branches:
      - main
      - security/hardening-2026-09-14
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Dependency audit
        run: bun audit --audit-level=high

      - name: ESLint
        run: bun run lint
